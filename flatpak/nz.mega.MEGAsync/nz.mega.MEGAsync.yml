id: nz.mega.MEGAsync
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: 5.15-25.08
finish-args:
  - --device=dri
  - --filesystem=xdg-download/MEGAsync/Downloads:create
  - --filesystem=xdg-download/MEGAsync/Uploads:create
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=QT_QPA_PLATFORM=xcb
command: megasync
rename-icon: mega
copy-icon: true
rename-desktop-file: megasync.desktop
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
modules:

  - name: MEGAsync
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
    - -DCMAKE_BUILD_TYPE:STRING='None'
    - -DENABLE_DESIGN_TOKENS_IMPORTER:BOOL='OFF'
    - -DENABLE_DESKTOP_APP_TESTS:BOOL='OFF'
    - -DUSE_BREAKPAD:BOOL='OFF'
    - -DUSE_FFMPEG:BOOL='OFF'
    - -DUSE_FREEIMAGE:BOOL='OFF'
    - -DUSE_PDFIUM:BOOL='OFF'
    - -Wno-author
    - -Wno-dev
    build-options:
      cxxflags: "-DNDEBUG"
      env:
        DESKTOP_DESTDIR: /app
    post-install:
      # Manually install the metainfo file (replaces the old platform.pri patch)
      - install -Dm644 ../MEGASync/platform/linux/data/nz.mega.MEGAsync
      # Automatically add build version and date into AppData
      - |
        set -e
        VERSION=$(git describe --tags | sed -e 's/^[vV]//' -e 's/_Linux$//')
        DATE=$(date -d @$(git show -s --format=%ct) +'%Y-%m-%d')
        sed \
          -e "s/@VERSION@/${VERSION}/g" \
          -e "s/@DATE@/${DATE}/g" \
          -i /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/meganz/MEGAsync.git
        tag: v6.7.0.3_Linux
        commit: 4a586d2c74b190b0d06aaa855018e9d4ee5a2174
        x-checker-data:
          type: json
          url: https://api.github.com/repos/meganz/MEGAsync/releases
          tag-query: map(select(.tag_name | endswith("_Linux"))) | first | .tag_name
          version-query: $tag | sub("^v"; "") | sub("_Linux$"; "")
          timestamp-query: map(select(.tag_name==$tag)) | first | .published_at
          is-main-source: true
      - type: shell
        commands:
          # Prevent CMake from trying to download developer tools without network access
          - |
            set -e
            sed -i '/get_clang_format()/d' CMakeLists.txt
          # Apply the C++ dialog fix before CMake configures and builds
          - |
            set -e
            sed -i \
              's|QFileDialog::DontUseNativeDialog, false|QFileDialog::DontUseNativeDialog, true|' \
              src/MEGASync/{gui/MultiQFileDialog,MegaApplication}.cpp
          - |
            set -e
            sed -i \
              's|set(ENABLE_ISOLATED_GFX ON)|set(ENABLE_ISOLATED_GFX OFF)|' \
              cmake/modules/desktopapp_options.cmake
          - |
            set -e
            sed -i \
              -e 's|pkg_check_modules(cryptopp REQUIRED IMPORTED_TARGET libcrypto++)|pkg_check_modules(cryptopp REQUIRED IMPORTED_TARGET libcryptopp)|' \
              -e 's|pkg_check_modules(pdfium REQUIRED IMPORTED_TARGET pdfium)|pkg_check_modules(pdfium REQUIRED IMPORTED_TARGET libpdfium)|' \
              src/MEGASync/mega/cmake/modules/sdklib_libraries.cmake
          - |
            set -e
            sed -i \
              -e "s|find_package(cryptopp CONFIG REQUIRED)|find_package(PkgConfig REQUIRED)\npkg_check_modules(cryptopp REQUIRED IMPORTED_TARGET libcryptopp)|" \
              -e 's|cryptopp::cryptopp|PkgConfig::cryptopp|' \
              src/MEGAUpdateGenerator/CMakeLists.txt
      - type: patch
        path: patches/0001-feat-add-AppData-manifest.patch
    modules:

      - name: cryptopp
        no-autogen: true
        make-args:
          - PREFIX=/app
          - LIBDIR=/app/lib
          - shared
          - libcryptopp.pc
        install-rule: install
        make-install-args:
          - PREFIX=/app
          - LIBDIR=/app/lib
        build-options:
          # Generally speaking, you should not use Link Time Optimization for
          # Crypto++. There are three reasons for the recommendation. First, we
          # don't want the linker changing object files or the executables
          # produced during link. The linker's job is to combine object files,
          # not attempt to peephole optimize them.
          # https://www.cryptopp.com/wiki/Link_Time_Optimization
          cflags: -fno-lto
          cxxflags: -fno-lto
        sources:
          - type: git
            url: https://github.com/weidai11/cryptopp.git
            tag: CRYPTOPP_8_9_0
            commit: 843d74c7c97f9e19a615b8ff3c0ca06599ca501b
            x-checker-data:
              type: json
              url: https://api.github.com/repos/weidai11/cryptopp/releases/latest
              tag-query: .tag_name
              version-query: .tag_name
              timestamp-query: .published_at
        cleanup:
          - /bin
          - /share

      - name: c-ares
        buildsystem: cmake-ninja
        sources:
          - type: git
            url: https://github.com/c-ares/c-ares.git
            tag: v1.34.9
            sha256: sha256:9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f
            x-checker-data:
              type: json
              url: https://api.github.com/repos/c-ares/c-ares/releases/latest
              tag-query: .tag_name
              version-query: .tag_name
              timestamp-query: .published_at
        cleanup:
          - /bin

      - name: freeimage
        subdir: FreeImage/trunk
        no-autogen: true
        build-options:
          cflags: "-Wno-error=implicit-function-declaration"
          arch:
            aarch64:
              cflags: -fPIC
              cxxflags: -fPIC -std=c++11
            x86_64:
              cxxflags: -std=c++11
        make-install-args:
          - DESTDIR=/app
          - INCDIR=/app/include
          - INSTALLDIR=/app/lib
        sources:
          - type: svn
            url: https://svn.code.sf.net/p/freeimage/svn/
            revision: r1911
          - type: patch
            path: patches/freeimage-makefile-install.patch

      - name: libsodium
        sources:
          - type: git
            url: https://github.com/jedisct1/libsodium.git
            tag: 1.0.22
            commit: 77e1ce5d6dee871c49ef211222ba18ef0c486bda
            x-checker-data:
              type: json
              url: https://api.github.com/repos/jedisct1/libsodium/releases/latest
              tag-query: .tag_name
              version-query: .tag_name
              timestamp-query: .published_at

      - name: libmediainfo
        buildsystem: cmake-ninja
        subdir: Project/CMake
        builddir: true
        sources:
          - type: archive
            url: https://old.mediaarea.net/download/source/libmediainfo/26.10/libmediainfo_26.10.tar.xz
            sha512: 5b155195d92c098c05ea7e9bd5af884350186367297535a3d533a6657bb7a1f0a307d585a10e92caaca0a0d16815c90525b9bb9de9bfc373d44f89cad7ee8c6a
        modules:

          - name: libzen
            buildsystem: cmake-ninja
            subdir: Project/CMake
            builddir: true
            config-opts: 
            - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            sources:
              - type: archive
                url: https://old.mediaarea.net/download/source/libzen/0.4.41/libzen_0.4.41.tar.xz
                sha256: 933bad3b7ecd29dc6bdc88a83645c83dfd098c15b0b90d6177a37fa1536704e8

      - name: libuv
        sources:
          - type: archive
            url: https://dist.libuv.org/dist/v1.53.0/libuv-v1.53.0.tar.gz
            sha256: cb0d6dd2128d5a95bd242c6cc982a24fe608fa93da57b6b4ec763b0018c53e64

      - name: LibRaw
        config-opts:
          - --disable-examples
          - --disable-static
        sources:
          - type: archive
            url: https://www.libraw.org/data/LibRaw-0.22.3.tar.gz
            sha256: 789f3c33466210a1a0907f747a97c715d21bbf4af712f257fcbbd90111b227e4
        cleanup:
          - /bin

  - name: xrdb
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/app/xrdb-1.2.3.tar.xz
        sha256: c88f560243278c896ce4fc92ae5a45a2b505a316ffa427fe55b02e5d5914c4e4
        x-checker-data:
          type: html
          url: https://xorg.freedesktop.org/archive/individual/app/
          pattern: (xrdb-(\d\.\d+\.?\d*).tar.gz)
    modules:

      - name: libXmu
        sources:
          - type: archive
            url: https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.3.1.tar.xz
            sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4
            x-checker-data:
              type: html
              url: https://xorg.freedesktop.org/archive/individual/lib/
              pattern: (libXmu-(\d\.\d+\.?\d*).tar.gz)
